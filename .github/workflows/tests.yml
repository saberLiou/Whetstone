name: Tests

# PR 與推送到預設分支時檢查安裝與測試
on:
  push:
    # 觸發條件不支援 expression，無法寫成 default branch；改預設分支時要一併修改
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # PHPUnit 8.5 需要 PHP >= 7.2；Laravel 5.8 / Testbench 3.8 不支援 PHP 8
        php: ['7.2', '7.3', '7.4']
    name: PHP ${{ matrix.php }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-php${{ matrix.php }}-

      # 套件不提交 composer.lock，因此以 update 依各 PHP 版本解析相依套件
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Test
        run: composer test
